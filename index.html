    // ----- Quiz Engine (handles language switching) -----
    class QuizEngine {
        constructor(prefix) {
            this.prefix = prefix;
            this.lang = 'english'; // default
            this.total = 30;
            if (prefix === 'hot') this.total = 20;
            this.questions = questionsData[this.lang][prefix];
            this.currentIndex = 0;
            this.score = 0;
            this.answered = false;
            this.active = false; // track if initialized and shown

            // DOM
            this.scoreDisplay = document.getElementById(prefix + 'ScoreDisplay');
            this.currentQSpan = document.getElementById(prefix + 'CurrentQ');
            this.questionText = document.getElementById(prefix + 'QuestionText');
            this.optionsDiv = document.getElementById(prefix + 'Options');
            this.nextBtn = document.getElementById(prefix + 'NextBtn');
            this.restartBtn = document.getElementById(prefix + 'RestartBtn');
            this.resultDiv = document.getElementById(prefix + 'Result');
            this.finalScoreSpan = document.getElementById(prefix + 'FinalScore');
            this.againBtn = document.getElementById(prefix + 'AgainBtn');
            this.navDiv = document.getElementById(prefix + 'Nav');
            this.questionContainer = document.getElementById(prefix + 'QuestionContainer');

            // Bindings
            this.nextBtn.addEventListener('click', () => this.nextQuestion());
            this.restartBtn.addEventListener('click', () => this.restart());
            this.againBtn.addEventListener('click', () => this.restart());
        }

        setLanguage(lang) {
            this.lang = lang;
            this.questions = questionsData[lang][this.prefix];
            this.restart();
        }

        start() {
            this.active = true;
            this.currentIndex = 0;
            this.score = 0;
            this.answered = false;
            this.resultDiv.classList.add('hidden');
            this.navDiv.classList.remove('hidden');
            this.questionContainer.classList.remove('hidden');
            this.updateScore();
            this.renderQuestion();
            this.nextBtn.disabled = true;
        }

        renderQuestion() {
            if (this.currentIndex >= this.questions.length) {
                this.showResult();
                return;
            }
            const q = this.questions[this.currentIndex];
            this.questionText.textContent = q.q;
            this.optionsDiv.innerHTML = '';
            this.answered = false;
            this.nextBtn.disabled = true;

            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => this.selectOption(idx, btn));
                this.optionsDiv.appendChild(btn);
            });
            this.currentQSpan.textContent = this.currentIndex + 1;
        }

        selectOption(index, btn) {
            if (this.answered) return;
            this.answered = true;
            const correct = this.questions[this.currentIndex].ans;
            const allBtns = this.optionsDiv.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.remove('selected', 'correct', 'incorrect'));

            btn.classList.add('selected');
            if (index === correct) {
                btn.classList.add('correct');
                this.score++;
            } else {
                btn.classList.add('incorrect');
                allBtns[correct].classList.add('correct');
            }
            this.updateScore();
            this.nextBtn.disabled = false;
        }

        nextQuestion() {
            if (!this.answered) return;
            this.currentIndex++;
            this.answered = false;
            if (this.currentIndex < this.questions.length) {
                this.renderQuestion();
            } else {
                this.showResult();
            }
        }

        showResult() {
            this.questionContainer.classList.add('hidden');
            this.navDiv.classList.add('hidden');
            this.resultDiv.classList.remove('hidden');
            this.finalScoreSpan.textContent = this.score;
        }

        updateScore() {
            this.scoreDisplay.textContent = this.score;
        }

        restart() {
            this.start();
        }
    }

    // Init quizzes
    const mcqQuiz = new QuizEngine('mcq');
    const hotQuiz = new QuizEngine('hot');

    // ---- Page & Language management ----
    const pages = ['videoPage', 'mcqPage', 'hotPage'];
    let currentPageIndex = 0;
    const pageTitles = ['Video', 'MCQ (30)', 'HOT (20)'];

    const videoPage = document.getElementById('videoPage');
    const mcqPage = document.getElementById('mcqPage');
    const hotPage = document.getElementById('hotPage');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pageTitle = document.getElementById('pageTitle');
    const langToggles = document.getElementById('langToggles');
    const langEnBtn = document.getElementById('langEn');
    const langOdBtn = document.getElementById('langOd');

    function showLanguageToggle(page) {
        if (page === 'videoPage') {
            langToggles.classList.add('hidden');
        } else {
            langToggles.classList.remove('hidden');
            // Update active language button
            const currentLang = (page === 'mcqPage') ? mcqQuiz.lang : hotQuiz.lang;
            langEnBtn.classList.toggle('active', currentLang === 'english');
            langOdBtn.classList.toggle('active', currentLang === 'odia');
        }
    }

    function showPage(index) {
        videoPage.classList.remove('active');
        mcqPage.classList.remove('active');
        hotPage.classList.remove('active');
        if (index === 0) {
            videoPage.classList.add('active');
            showLanguageToggle('videoPage');
            pageTitle.textContent = pageTitles[0];
        } else if (index === 1) {
            mcqPage.classList.add('active');
            if (!mcqQuiz.active) mcqQuiz.start();
            showLanguageToggle('mcqPage');
            pageTitle.textContent = pageTitles[1];
        } else {
            hotPage.classList.add('active');
            if (!hotQuiz.active) hotQuiz.start();
            showLanguageToggle('hotPage');
            pageTitle.textContent = pageTitles[2];
        }
        prevPageBtn.disabled = index === 0;
        nextPageBtn.disabled = index === pages.length - 1;
    }

    // Language switch handlers
    langEnBtn.addEventListener('click', () => {
        if (currentPageIndex === 1) mcqQuiz.setLanguage('english');
        else if (currentPageIndex === 2) hotQuiz.setLanguage('english');
        showPage(currentPageIndex); // refresh toggle ui
    });
    langOdBtn.addEventListener('click', () => {
        if (currentPageIndex === 1) mcqQuiz.setLanguage('odia');
        else if (currentPageIndex === 2) hotQuiz.setLanguage('odia');
        showPage(currentPageIndex);
    });

    prevPageBtn.addEventListener('click', () => {
        if (currentPageIndex > 0) {
            currentPageIndex--;
            showPage(currentPageIndex);
        }
    });

    nextPageBtn.addEventListener('click', () => {
        if (currentPageIndex < pages.length - 1) {
            currentPageIndex++;
            showPage(currentPageIndex);
        }
    });

    // Start
    showPage(0);
